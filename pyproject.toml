[project]
name = "football-analytics-tutorials"
version = "2.0.0"
description = "Match report skill + tutorials for football analytics (WhoScored + FotMob)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Ricardo Heredia"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "requests",
    "mplsoccer",
]

[project.optional-dependencies]
scrape = [
    "playwright",  # headless Chromium for WhoScored (bot-walled)
]
dev = [
    "jupyter",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/ricardoherediaj/football-analytics-tutorials"
Repository = "https://github.com/ricardoherediaj/football-analytics-tutorials"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
